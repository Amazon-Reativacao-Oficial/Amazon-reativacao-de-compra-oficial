<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           maximum-scale=1,
           viewport-fit=cover"
>

<meta name="theme-color" content="#edbb81">

<title>Pagamento PIX</title>

<style>

/* ============================================================
   CONFIGURAÇÃO GERAL
   ============================================================ */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;

  background: #ffffff;
  color: #111111;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  -webkit-text-size-adjust: 100%;
}


/* ============================================================
   CABEÇALHO
   ============================================================ */

.header {

  width: 100%;

  height: 150px;

  position: relative;

  display: flex;

  align-items: flex-end;

  justify-content: center;

  padding:
    0
    18px
    25px;

  color: #ffffff;

  background:
    repeating-linear-gradient(
      90deg,
      #edbb81 0px,
      #edbb81 18px,
      #e5ae72 18px,
      #e5ae72 23px
    );
}


.header-title {

  margin: 0;

  padding: 0;

  text-align: center;

  font-size: 23px;

  line-height: 1.15;

  font-weight: 700;
}


.back {

  position: absolute;

  left: 20px;

  bottom: 20px;

  color: #ffffff;

  font-size: 39px;

  line-height: 1;

  font-weight: 300;
}


/* ============================================================
   FAIXA ESCURA
   ============================================================ */

.dark-bar {

  width: 100%;

  height: 78px;

  background: #283442;
}


/* ============================================================
   ÁREA DO PAGAMENTO
   ============================================================ */

.payment {

  width: 100%;

  max-width: 520px;

  margin: 0 auto;

  padding:
    42px
    20px
    35px;

  text-align: center;
}


/* ============================================================
   VALOR
   ============================================================ */

.amount {

  margin: 0 0 42px;

  padding: 0;

  font-size: 28px;

  line-height: 1.2;

  font-weight: 700;
}


/* ============================================================
   QR CODE
   ============================================================ */

.qrcode {

  width: 215px;

  height: 215px;

  margin:
    0 auto
    42px;

  padding: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;

  background: transparent;
}


/*
   O QR fica somente com os módulos.
   Não existe caixa, borda ou fundo
   adicional em volta dele.
*/

.qrcode svg {

  width: 100%;

  height: 100%;

  display: block;

  background: transparent;
}


/* ============================================================
   TÍTULO
   ============================================================ */

.instructions-title {

  margin:
    0
    0
    18px;

  padding: 0;

  color: #111111;

  font-size: 21px;

  line-height: 1.25;

  font-weight: 700;
}


/* ============================================================
   TEXTO
   ============================================================ */

.instructions {

  margin: 0;

  padding: 0;

  color: #111111;

  font-size: 18px;

  line-height: 1.4;

  font-weight: 400;
}


/* ============================================================
   NÃO ATUALIZE
   ============================================================ */

.no-refresh {

  margin:
    30px
    0
    0;

  padding: 0;

  color: #111111;

  font-size: 18px;

  line-height: 1.3;

  font-weight: 400;
}


/* ============================================================
   CONTADOR
   ============================================================ */

.remaining {

  margin:
    28px
    0
    0;

  padding: 0;

  color: #111111;

  font-size: 18px;

  line-height: 1.3;

  font-weight: 400;
}


.remaining strong {

  font-weight: 700;
}


/* ============================================================
   BOTÃO COPIAR
   ============================================================ */

.copy-button {

  width: 100%;

  height: 66px;

  margin:
    34px
    0
    0;

  padding: 0;

  border: none;

  border-radius: 40px;

  background: #ffd814;

  color: #111111;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size: 23px;

  font-weight: 400;

  text-align: center;

  cursor: pointer;

  outline: none;

  -webkit-tap-highlight-color: transparent;

  touch-action: manipulation;
}


.copy-button:active {

  transform: scale(0.99);
}


.copy-button:disabled {

  opacity: 0.55;

  cursor: default;
}


/* ============================================================
   MENSAGEM DE CÓPIA
   ============================================================ */

.copy-status {

  min-height: 18px;

  margin:
    9px
    0
    0;

  padding: 0;

  color: #111111;

  font-size: 13px;

  line-height: 1.2;
}


/* ============================================================
   CELULARES MENORES
   ============================================================ */

@media (max-width: 390px) {

  .header {

    height: 135px;

    padding-bottom: 22px;
  }


  .header-title {

    font-size: 21px;
  }


  .back {

    left: 16px;

    bottom: 17px;

    font-size: 35px;
  }


  .dark-bar {

    height: 68px;
  }


  .payment {

    padding:
      34px
      17px
      30px;
  }


  .amount {

    margin-bottom: 34px;

    font-size: 25px;
  }


  .qrcode {

    width: 190px;

    height: 190px;

    margin-bottom: 34px;
  }


  .instructions-title {

    margin-bottom: 14px;

    font-size: 19px;
  }


  .instructions {

    font-size: 16px;

    line-height: 1.35;
  }


  .no-refresh {

    margin-top: 25px;

    font-size: 16px;
  }


  .remaining {

    margin-top: 23px;

    font-size: 16px;
  }


  .copy-button {

    height: 59px;

    margin-top: 27px;

    font-size: 21px;
  }

}


/* ============================================================
   TELAS MUITO BAIXAS
   ============================================================ */

@media (max-height: 700px) {

  .header {

    height: 115px;

    padding-bottom: 18px;
  }


  .header-title {

    font-size: 19px;
  }


  .back {

    bottom: 13px;

    font-size: 31px;
  }


  .dark-bar {

    height: 50px;
  }


  .payment {

    padding-top: 25px;
  }


  .amount {

    margin-bottom: 25px;

    font-size: 23px;
  }


  .qrcode {

    width: 155px;

    height: 155px;

    margin-bottom: 25px;
  }


  .instructions-title {

    font-size: 17px;

    margin-bottom: 10px;
  }


  .instructions {

    font-size: 14px;
  }


  .no-refresh {

    margin-top: 18px;

    font-size: 14px;
  }


  .remaining {

    margin-top: 16px;

    font-size: 14px;
  }


  .copy-button {

    height: 50px;

    margin-top: 19px;

    font-size: 18px;
  }


  .copy-status {

    display: none;
  }

}

</style>

</head>


<body>


<!-- ==========================================================
     CABEÇALHO
     ========================================================== -->

<header class="header">

  <span class="back">←</span>

  <h1 class="header-title">
    Autorizar forma de pagamento
  </h1>

</header>


<!-- ==========================================================
     FAIXA ESCURA
     ========================================================== -->

<div class="dark-bar"></div>


<!-- ==========================================================
     PAGAMENTO
     ========================================================== -->

<main class="payment">


  <!-- VALOR -->

  <h2
    id="amount"
    class="amount"
  >
    Total a pagar: R$ 0,00
  </h2>


  <!-- QR CODE -->

  <div
    id="qrcode"
    class="qrcode"
  ></div>


  <!-- TÍTULO -->

  <h2 class="instructions-title">
    Escaneie ou copie o código para pagar
  </h2>


  <!-- TEXTO -->

  <p class="instructions">

    Escaneie o QR code com a câmera do seu celular
    <br>

    para pagar no aplicativo do seu banco ou copie o
    <br>

    código clicando no botão abaixo.

  </p>


  <!-- NÃO ATUALIZE -->

  <p class="no-refresh">
    Não atualize a página.
  </p>


  <!-- CONTADOR -->

  <p class="remaining">

    Tempo restante:

    <strong id="timer">
      10:00
    </strong>

  </p>


  <!-- BOTÃO -->

  <button
    id="copyButton"
    class="copy-button"
    type="button"
  >
    Copiar código
  </button>


  <!-- STATUS -->

  <p
    id="copyStatus"
    class="copy-status"
  ></p>


</main>


<!-- ==========================================================
     BIBLIOTECA QR CODE
     ========================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>


<script>

/* ============================================================
   CONFIGURAÇÃO
   ============================================================

   ALTERE SOMENTE ESTES 3 CAMPOS.

   productName = nome do produto

   amount = valor

   pixCode = PIX COPIA E COLA

   ============================================================ */


const CONFIG = {

  productName:
    "Meu Produto",


  amount:
    0.00,


  pixCode:
    "COLE_AQUI_SEU_PIX_COPIA_E_COLA"

};


/* ============================================================
   ELEMENTOS
   ============================================================ */

const amountElement =
  document.getElementById(
    "amount"
  );


const qrElement =
  document.getElementById(
    "qrcode"
  );


const timerElement =
  document.getElementById(
    "timer"
  );


const copyButton =
  document.getElementById(
    "copyButton"
  );


const copyStatus =
  document.getElementById(
    "copyStatus"
  );


const pixCode =
  String(
    CONFIG.pixCode || ""
  ).trim();


/* ============================================================
   TÍTULO
   ============================================================ */

document.title =
  CONFIG.productName ||
  "Pagamento PIX";


/* ============================================================
   VALOR
   ============================================================ */

function formatMoney(value) {

  const number =
    Number(value);


  if (
    !Number.isFinite(number)
  ) {

    return "R$ 0,00";

  }


  return number.toLocaleString(
    "pt-BR",
    {

      style:
        "currency",

      currency:
        "BRL"

    }
  );

}


amountElement.textContent =
  "Total a pagar: " +
  formatMoney(
    CONFIG.amount
  );


/* ============================================================
   GERAR QR CODE
   ============================================================ */

function renderQrCode() {

  qrElement.innerHTML =
    "";


  if (
    !pixCode ||
    pixCode ===
      "COLE_AQUI_SEU_PIX_COPIA_E_COLA"
  ) {

    return;

  }


  if (
    typeof qrcode !==
    "function"
  ) {

    return;

  }


  try {

    const qr =
      qrcode(
        0,
        "M"
      );


    qr.addData(
      pixCode
    );


    qr.make();


    qrElement.innerHTML =
      qr.createSvgTag({

        cellSize:
          5,

        margin:
          0,

        scalable:
          true

      });


  } catch (error) {

    console.error(
      error
    );

  }

}


/* ============================================================
   COPIAR PIX
   ============================================================ */

function fallbackCopy(text) {

  const textarea =
    document.createElement(
      "textarea"
    );


  textarea.value =
    text;


  textarea.setAttribute(
    "readonly",
    ""
  );


  textarea.style.position =
    "fixed";


  textarea.style.left =
    "-9999px";


  textarea.style.top =
    "0";


  textarea.style.opacity =
    "0";


  document.body.appendChild(
    textarea
  );


  textarea.focus();


  textarea.select();


  textarea.setSelectionRange(
    0,
    textarea.value.length
  );


  const success =
    document.execCommand(
      "copy"
    );


  textarea.remove();


  if (!success) {

    throw new Error(
      "Falha ao copiar"
    );

  }

}


async function copyPix() {

  if (
    !pixCode
  ) {

    return;

  }


  if (
    Date.now() >=
    expirationTime
  ) {

    return;

  }


  try {

    if (
      navigator.clipboard &&
      window.isSecureContext
    ) {

      await navigator.clipboard.writeText(
        pixCode
      );

    } else {

      fallbackCopy(
        pixCode
      );

    }


    showCopied();


  } catch (error) {

    try {

      fallbackCopy(
        pixCode
      );

      showCopied();

    } catch (error2) {

      copyStatus.textContent =
        "Não foi possível copiar.";

    }

  }

}


function showCopied() {

  copyButton.textContent =
    "Código copiado!";


  copyStatus.textContent =
    "";


  setTimeout(
    function () {

      copyButton.textContent =
        "Copiar código";

    },
    1600
  );

}


copyButton.addEventListener(
  "click",
  copyPix
);


/* ============================================================
   CONTADOR
   ============================================================

   10 MINUTOS
   ============================================================ */

const expirationTime =
  Date.now() +
  (
    10 *
    60 *
    1000
  );


function updateTimer() {

  const remaining =
    Math.max(
      0,
      expirationTime -
      Date.now()
    );


  const totalSeconds =
    Math.ceil(
      remaining /
      1000
    );


  const minutes =
    Math.floor(
      totalSeconds /
      60
    );


  const seconds =
    totalSeconds %
    60;


  timerElement.textContent =

    String(
      minutes
    ).padStart(
      2,
      "0"
    )

    + ":"

    +

    String(
      seconds
    ).padStart(
      2,
      "0"
    );


  if (
    remaining <= 0
  ) {

    timerElement.textContent =
      "00:00";


    copyButton.disabled =
      true;


    clearInterval(
      timerInterval
    );

  }

}


/* ============================================================
   INICIAR
   ============================================================ */

renderQrCode();

updateTimer();


const timerInterval =
  setInterval(
    updateTimer,
    250
  );

</script>

</body>
</html>
