<style>

/* =========================================================
   CONFIGURAÇÃO DA PÁGINA
   ========================================================= */

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;

  padding: 0;

  width: 100%;

  min-height: 100%;

  background: #ffffff;

  color: #111111;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  -webkit-text-size-adjust: 100%;

/* =========================================================
   CABEÇALHO
   ========================================================= */

.header {

  width: 100%;

  height: 135px;

  position: relative;

  display: flex;

  align-items: flex-end;

  justify-content: center;

  padding:
    0
    20px
    22px;

  color: #ffffff;

  background:
    repeating-linear-gradient(
      90deg,
      #edbb81 0px,
      #edbb81 18px,
      #e5ae72 18px,
      #e5ae72 23px
    );

}


.header-title {

  margin: 0;

  text-align: center;

  font-size: 22px;

  line-height: 1.15;

  font-weight: 700;

}


.back {

  position: absolute;

  left: 17px;

  bottom: 16px;

  color: #ffffff;

  font-size: 38px;

  line-height: 1;

  font-weight: 300;

}


/* =========================================================
   FAIXA ESCURA
   ========================================================= */

.dark-bar {

  width: 100%;

  height: 65px;

  background: #283442;

}


/* =========================================================
   ÁREA DE PAGAMENTO
   ========================================================= */

.payment {

  width: 100%;

  max-width: 520px;

  margin: 0 auto;

  padding:
    32px
    18px
    30px;

  text-align: center;

}


/* =========================================================
   VALOR
   ========================================================= */

.amount {

  margin:
    0
    0
    28px;

  padding: 0;

  font-size: 26px;

  line-height: 1.2;

  font-weight: 700;

}


/* =========================================================
   QR CODE
   ========================================================= */

.qrcode {

  width: 190px;

  height: 190px;

  margin:
    0
    auto
    30px;

  padding: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  background: transparent;

  overflow: hidden;

}


/*
   QR Code sem caixa,
   sem borda e sem quadrado externo.
*/

.qrcode svg {

  display: block;

  width: 100%;

  height: 100%;

  background: transparent;

}


/* =========================================================
   TÍTULO
   ========================================================= */

.instructions-title {

  margin:
    0
    0
    13px;

  padding: 0;

  font-size: 19px;

  line-height: 1.25;

  font-weight: 700;

}


/* =========================================================
   TEXTO
   ========================================================= */

.instructions {

  margin: 0;

  padding: 0;

  font-size: 16px;

  line-height: 1.38;

  color: #111111;

}


/* =========================================================
   NÃO ATUALIZE
   ========================================================= */

.no-refresh {

  margin:
    23px
    0
    0;

  padding: 0;

  color: #111111;

  font-size: 16px;

}


/* =========================================================
   TEMPO
   ========================================================= */

.remaining {

  margin:
    19px
    0
    0;

  padding: 0;

  color: #111111;

  font-size: 16px;

}


.remaining strong {

  font-weight: 700;

}


/* =========================================================
   BOTÃO COPIAR
   ========================================================= */

.copy-button {

  width: 100%;

  height: 58px;

  margin:
    24px
    0
    0;

  padding: 0;

  border: none;

  border-radius: 32px;

  background: #ffd814;

  color: #111111;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size: 21px;

  font-weight: 400;

  cursor: pointer;

  touch-action: manipulation;

  -webkit-tap-highlight-color: transparent;

}


.copy-button:active {

  transform: scale(0.99);

}


.copy-button:disabled {

  opacity: 0.55;

  cursor: default;

}


/* =========================================================
   CELULARES PEQUENOS
   ========================================================= */

/* =========================================================

  .dark-bar {

  }

  }

    font-size: 22px;

    margin-bottom: 18px;

  }

  }

  }

<body>


<!-- =========================================================
     CABEÇALHO
     ========================================================= -->

<header class="header">

  <span class="back">
    ←
  </span>

  <h1 class="header-title">
    Autorizar forma de pagamento
  </h1>

</header>


<div class="dark-bar"></div>


<!-- =========================================================
     PAGAMENTO
     ========================================================= -->

<main class="payment">


  <h2
    id="amount"
    class="amount"
  >
    Total a pagar: R$ 0,00
  </h2>


  <div
    id="qrcode"
    class="qrcode"
  ></div>


  <h2 class="instructions-title">
    Escaneie ou copie o código para pagar
  </h2>


  <p class="instructions">

    Escaneie o QR code com a câmera do seu celular
    <br>

    para pagar no aplicativo do seu banco ou copie o
    <br>

    código clicando no botão abaixo.

  </p>


  <p class="no-refresh">
    Não atualize a página.
  </p>


  <p class="remaining">

    Tempo restante:

    <strong id="timer">
      10:00
    </strong>

  </p>


  <button
    id="copyButton"
    class="copy-button"
    type="button"
  >
    Copiar código
  </button>


</main>


<!-- =========================================================
     GERADOR DE QR CODE
     ========================================================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>


<script>

/* ============================================================
   CONFIGURAÇÃO DA COBRANÇA
   ============================================================

   ALTERE SOMENTE ESTES 3 CAMPOS:

   productName = nome do produto

   amount = valor

   pixCode = PIX copia e cola completo

   ============================================================ */

const CONFIG = {

  productName:
    "Meu Produto",


  amount:
    0.00,


  pixCode:
    "COLE_AQUI_SEU_PIX_COPIA_E_COLA"

};


/* ============================================================
   ELEMENTOS
   ============================================================ */

const amountElement =
  document.getElementById(
    "amount"
  );


const qrElement =
  document.getElementById(
    "qrcode"
  );


const timerElement =
  document.getElementById(
    "timer"
  );


const copyButton =
  document.getElementById(
    "copyButton"
  );


const pixCode =
  String(
    CONFIG.pixCode || ""
  ).trim();


/* ============================================================
   TÍTULO
   ============================================================ */

document.title =
  CONFIG.productName ||
  "Pagamento PIX";


/* ============================================================
   VALOR
   ============================================================ */

function formatMoney(value) {

  const number =
    Number(value);


  if (
    !Number.isFinite(number)
  ) {

    return "R$ 0,00";

  }


  return number.toLocaleString(
    "pt-BR",
    {
      style:
        "currency",

      currency:
        "BRL"
    }
  );

}


amountElement.textContent =
  "Total a pagar: " +
  formatMoney(
    CONFIG.amount
  );


/* ============================================================
   QR CODE
   ============================================================ */

function renderQrCode() {

  qrElement.innerHTML =
    "";


  if (
    !pixCode ||
    pixCode ===
      "COLE_AQUI_SEU_PIX_COPIA_E_COLA"
  ) {

    return;

  }


  if (
    typeof qrcode !==
    "function"
  ) {

    return;

  }


  try {

    const qr =
      qrcode(
        0,
        "M"
      );


    qr.addData(
      pixCode
    );


    qr.make();


    qrElement.innerHTML =
      qr.createSvgTag({

        cellSize:
          5,

        margin:
          0,

        scalable:
          true

      });


  } catch (error) {

    console.error(
      error
    );

  }

}


/* ============================================================
   COPIAR PIX
   ============================================================ */

function fallbackCopy(text) {

  const textarea =
    document.createElement(
      "textarea"
    );


  textarea.value =
    text;


  textarea.setAttribute(
    "readonly",
    ""
  );


  textarea.style.position =
    "fixed";


  textarea.style.left =
    "-9999px";


  textarea.style.top =
    "0";


  textarea.style.opacity =
    "0";


  document.body.appendChild(
    textarea
  );


  textarea.focus();


  textarea.select();


  textarea.setSelectionRange(
    0,
    textarea.value.length
  );


  const success =
    document.execCommand(
      "copy"
    );


  textarea.remove();


  if (!success) {

    throw new Error(
      "Falha ao copiar"
    );

  }

}


async function copyPix() {

  if (!pixCode) {

    return;

  }


  if (
    Date.now() >=
    expirationTime
  ) {

    return;

  }


  try {

    if (
      navigator.clipboard &&
      window.isSecureContext
    ) {

      await navigator.clipboard.writeText(
        pixCode
      );

    } else {

      fallbackCopy(
        pixCode
      );

    }


    copyButton.textContent =
      "Copiado!";


    setTimeout(
      function () {

        copyButton.textContent =
          "Copiar código";

      },
      1600
    );


  } catch (error) {

    try {

      fallbackCopy(
        pixCode
      );


      copyButton.textContent =
        "Copiado!";


      setTimeout(
        function () {

          copyButton.textContent =
            "Copiar código";

        },
        1600
      );


    } catch (error2) {

      alert(
        "Não foi possível copiar o código PIX."
      );

    }

  }

}


copyButton.addEventListener(
  "click",
  copyPix
);


/* ============================================================
   CONTADOR
   ============================================================ */

const expirationTime =
  Date.now() +
  (
    10 *
    60 *
    1000
  );


function updateTimer() {

  const remaining =
    Math.max(
      0,
      expirationTime -
      Date.now()
    );


  const totalSeconds =
    Math.ceil(
      remaining /
      1000
    );


  const minutes =
    Math.floor(
      totalSeconds /
      60
    );


  const seconds =
    totalSeconds %
    60;


  timerElement.textContent =

    String(
      minutes
    ).padStart(
      2,
      "0"
    )

    +

    ":"

    +

    String(
      seconds
    ).padStart(
      2,
      "0"
    );


  if (
    remaining <= 0
  ) {

    timerElement.textContent =
      "00:00";


    copyButton.disabled =
      true;


    clearInterval(
      timerInterval
    );

  }

}


/* ============================================================
   INICIAR
   ============================================================ */

renderQrCode();

updateTimer();


const timerInterval =
  setInterval(
    updateTimer,
    250
  );

</script>

</body>
